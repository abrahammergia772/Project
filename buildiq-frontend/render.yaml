# ============================================================
# BuildIQ frontend — Render static site config
#
# Frontend and backend are deployed as SEPARATE Render services; this file
# describes only the static site. (A root-level render.yaml also defines both
# as one Blueprint — use whichever suits you, not both.)
#
# Deploying this service by hand instead? Set these in the dashboard:
#   Root Directory    : buildiq-frontend     <-- REQUIRED
#   Build Command     : (leave empty — plain HTML/CSS/JS, no build step)
#   Publish Directory : .
#
# After it deploys, two things must line up or the app will look broken:
#   1. buildiq-frontend/js/config.js -> API_BASE must be the API service URL
#      (the key is API_BASE, not API_BASE_URL).
#   2. On the API service, CORS_ORIGINS must be THIS site's origin.
# ============================================================
services:
  - type: web
    name: buildiq-frontend
    runtime: static
    rootDir: buildiq-frontend
    buildCommand: ""
    staticPublishPath: .
    # Multi-page app, not a SPA: each .html is served by filename, so no
    # rewrite/fallback rule is needed. A SPA-style catch-all would break
    # admin.html and the other pages.
    # Serve /chatbot as well as /chatbot.html. Render already resolves the
    # extensionless form for static sites; these rules make it explicit and
    # keep it working if that default ever changes.
    routes:
      # The app is a single page: everything renders inside app.html, so the
      # address bar only ever shows the bare domain.
      - type: rewrite
        source: /app
        destination: /app.html
      # Keep the per-page files reachable so an old bookmark still works.
      - type: rewrite
        source: /:page
        destination: /:page.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # Authenticated pages are client-side guarded; keep them out of search.
      - path: /*
        name: X-Robots-Tag
        value: noindex
