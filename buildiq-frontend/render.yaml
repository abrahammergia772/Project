# Render deployment config for BuildIQ frontend (static site)
# Deploy type: Static Site — no server process, no start command needed.
#
# To deploy:
#   1. Push this repo to GitHub.
#   2. On Render: New -> Static Site -> connect this repo.
#   3. Render will read this file automatically (or set the fields manually,
#      see below, if you prefer configuring through the dashboard).

services:
  - type: web
    name: buildiq-frontend
    runtime: static
    buildCommand: ""            # no build step — plain HTML/CSS/JS
    staticPublishPath: ./buildiq-frontend
    # Multi-page app (not a SPA) — each .html file is served directly by
    # filename, so no rewrite/fallback rule is needed here.
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
